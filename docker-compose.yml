services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iam_db
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: iam_pass
    ports:
      - "5436:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_user -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.25
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/liquibase/changelog
    command:
      - --url=jdbc:postgresql://postgres:5432/iam_db
      - --username=iam_user
      - --password=iam_pass
      - --changeLogFile=changelog/changelog-master.yaml
      - update

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iam_db
      DB_USER: iam_user
      DB_PASSWORD: iam_pass
      JWT_SECRET: iam_demo_secret_change_in_production
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  iam_postgres_data:
